# vivado 2024.2.2
# VCU128: openTPU (FeSens) LLM accelerator, S = 4 (build B: four slices, 8 HBM channels of 1 GiB),
# HBM2 8 GB, 40G Ethernet (QSFP1) + JTAG-to-AXI. Same sources as Top/otpu; target vcu128_s4.toml.

# Vivado: не больше 32 потоков; при MAX_THREADS > 1 битстрим не детерминирован.
[parameters]
MAX_THREADS = 32

[main]
PART=xcvu37p-fsvh2892-2L-e
TARGET_LANGUAGE=Verilog

# Top parameters for S = 4 (the top's defaults are S = 2's, Top/otpu): ARCH_HASH = target/vcu128_s4.toml
[generics]
S=4
ARCH_HASH=32'hf83fc219

# Сборка B (S = 4): против перегрузки длинных линий SLR (22.10, L1: уровень 6, WNS −0,83) —
# размещение с растеканием логики, агрессивные physopt/route и physopt после трассировки
[impl_1]
STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=AltSpreadLogic_high
STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=1
STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
